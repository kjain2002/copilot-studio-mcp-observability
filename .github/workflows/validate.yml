name: Validate
on: [push, pull_request]
permissions:
  contents: read
jobs:
  script:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Synthetic script tests
        shell: pwsh
        run: .\dataverse\tests\Test-Script.ps1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Local HTML viewer tests
        run: node --test dataverse\tests\Test-Viewer.cjs
      - name: Agent debugger parser tests
        shell: pwsh
        run: .\agent-debugger\tests\Test-DebugParser.ps1
